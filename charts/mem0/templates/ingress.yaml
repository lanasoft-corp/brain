# Dashboard prévu pour le réseau privé : le dashboard sur /, l'API sur /mem0, dont le contrôleur
# d'ingress doit retirer le préfixe avant l'API. Le dashboard appelle l'API depuis le navigateur, d'où
# ce passage par l'ingress ; l'API garde sa propre authentification (JWT du dashboard ou clé m0sk_).
# Désactivé par défaut : les restrictions (réseau privé seulement) et le retrait du préfixe sont
# déclarés dans les values du cluster, avec les objets de son contrôleur.
{{- if .Values.ingress.enabled }}
{{- $tls := printf "%s-tls" (replace "." "-" .Values.host) }}
{{- range $name, $ing := dict "dashboard" (dict "service" "mem0-dashboard" "path" "/") "api" (dict "service" "mem0-api" "path" "/mem0") }}
{{- $own := default dict (get (default dict (get $.Values.ingress $name)) "annotations") }}
{{- $annotations := merge (deepCopy $own) (deepCopy (default dict $.Values.ingress.annotations)) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ing.service }}
  labels:
    {{- include "mem0.labels" $ | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ $.Values.host }}]
      secretName: {{ $tls }}
  rules:
    - host: {{ $.Values.host }}
      http:
        paths:
          - path: {{ $ing.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $ing.service }}
                port:
                  name: http
{{- end }}
{{- end }}
