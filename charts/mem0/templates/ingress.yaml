# Dashboard réservé au réseau privé (lanRanges) : le dashboard sur /, l'API sur /mem0 (préfixe retiré
# avant l'API). Le dashboard appelle l'API depuis le navigateur, d'où ce passage par Traefik ;
# l'API garde sa propre authentification (JWT du dashboard ou clé m0sk_).
{{- $tls := printf "%s-tls" (replace "." "-" .Values.host) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mem0-dashboard
  labels:
    {{- include "mem0.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-lan-only@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.host }}]
      secretName: {{ $tls }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mem0-dashboard
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mem0-api
  labels:
    {{- include "mem0.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-lan-only@kubernetescrd,{{ .Release.Namespace }}-strip-mem0@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.host }}]
      secretName: {{ $tls }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /mem0
            pathType: Prefix
            backend:
              service:
                name: mem0-api
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.lanRanges | nindent 6 }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-mem0
spec:
  stripPrefix:
    prefixes: [/mem0]
