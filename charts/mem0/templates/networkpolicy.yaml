# API : le contrôleur d'ingress (dashboard vu du navigateur), le dashboard (appels côté serveur) et les clients
# marqués du label api.clientLabel (brain-mcp, scripts). Dashboard : le contrôleur d'ingress seulement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mem0-api
  labels:
    {{- include "mem0.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mem0-api
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- with .Values.networkPolicy.ingressController }}
        {{- if .namespaceSelector }}
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          {{- with .podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- end }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mem0-dashboard
        - podSelector:
            matchLabels:
              {{ .Values.api.clientLabel }}: "true"
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mem0-dashboard
  labels:
    {{- include "mem0.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mem0-dashboard
  policyTypes: [Ingress]
  {{- with .Values.networkPolicy.ingressController }}
  {{- if .namespaceSelector }}
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          {{- with .podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - port: 3000
  {{- end }}
  {{- end }}
