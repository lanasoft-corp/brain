apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mem0-data
  labels:
    {{- include "mem0.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0-api
  labels:
    {{- include "mem0.labels" . | nindent 4 }}
    app.kubernetes.io/name: mem0-api
spec:
  # Un réplica : l'historique SQLite vit sur un volume RWO. Recreate libère le volume avant de
  # démarrer le nouveau pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mem0-api
  template:
    metadata:
      labels:
        {{- include "mem0.labels" . | nindent 8 }}
        app.kubernetes.io/name: mem0-api
      annotations:
        checksum/config: {{ .Files.Get (printf "files/%s" .Values.configFile) | sha256sum | trunc 16 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "mem0.image" (dict "image" .Values.image.api "root" .) }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_HOST
              valueFrom: {secretKeyRef: {name: {{ .Values.database.secret }}, key: host}}
            - name: POSTGRES_PORT
              valueFrom: {secretKeyRef: {name: {{ .Values.database.secret }}, key: port}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: {{ .Values.database.secret }}, key: dbname}}
            # Base applicative (comptes, clés d'API, journaux) : la même que les vecteurs.
            - name: APP_DB_NAME
              valueFrom: {secretKeyRef: {name: {{ .Values.database.secret }}, key: dbname}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.database.secret }}, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.database.secret }}, key: password}}
            - name: DASHBOARD_URL
              value: https://{{ .Values.host }}
            - name: MEM0_TELEMETRY
              value: "false"
            - name: AUTH_DISABLED
              value: "false"
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          readinessProbe:
            httpGet:
              path: /auth/setup-status
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/mem0
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mem0-config
        - name: data
          persistentVolumeClaim:
            claimName: mem0-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mem0-api
  labels:
    {{- include "mem0.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mem0-api
  ports:
    - name: http
      port: 8000
      targetPort: http
