# Passerelle publique : Claude.ai, Claude Code et VS Code doivent pouvoir la joindre de partout.
# Tout appel est authentifié par la passerelle (jeton du fournisseur d'identité) ; seuls /healthz
# et les métadonnées de ressource protégée sont anonymes. Désactivée par défaut : l'exposer, et la
# limiter (débit par IP source en amont de la limite par identité de la passerelle...), est le choix
# du cluster, fait dans ses values avec les objets de son contrôleur d'ingress.
{{- if .Values.ingress.enabled }}
{{- $tls := printf "%s-tls" (replace "." "-" .Values.host) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.host }}]
      secretName: {{ $tls }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  name: http
---
{{- end }}
# Seul le contrôleur d'ingress joint la passerelle (personne si ses sélecteurs sont vides).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp
  policyTypes: [Ingress]
  {{- with .Values.networkPolicy.ingressController }}
  {{- if .namespaceSelector }}
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          {{- with .podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - port: 8080
  {{- end }}
  {{- end }}
